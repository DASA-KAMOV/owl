# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "owl"
version = "0.1.0"
edition = "2021"
authors = ["DASA-KAMOV <DASA-KAMOV@protonmail.com>"]
license = "GPL-3.0-or-later"
description = "Owl is a cross-platform tool for viewing, extracting and editing Psygnosis game data files."
repository = "https://github.com/DASA-KAMOV/Owl"

# When building on Linux, you may need to install bevy: https://github.com/bevyengine/bevy/blob/main/docs/linux_dependencies.md
[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui-file-dialog = "0.16.0"
egui_extras = { version = "0.37.0", features = ["datepicker"] }
egui_plot = "0.38.0"
image = "0.25.10"
jiff = "0.2.39" # Intentionally 0.2.39 until egui_extras updates to latest version of jiff
rayon = "1.12.0"
rodio = "0.23.0"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"
strip = true